 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Card</title>
    <style>
        #card {
            width: 300px;
            padding: 20px;
            border-radius: 15px;
            background: #f1f1f1;
            margin-top: 20px;
            transition: background-color 0.2s ease;
        }
        #card h2, #card p {
            margin: 6px 0;
        }
    </style>
</head>
<body>

    <button id="loadBtn">Load Product</button>

    <div id="card">
        <h2 id="pId">ID: </h2>
        <p id="pTag">Tag: </p>
        <p id="pHeight">Height: </p>
    </div>

    <script src="color.js"></script>

</body>
</html>
