<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouse Enter/Leave Counter</title>
  <style>
    .card {
      width: 200px;
      height: 200px;
      border: 2px solid black;
      margin: 50px auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      
    }
    .saveBtn {
      display: block;
      margin: 0 auto;
      margin-top: 20px;
      border-radius: 30px;
      background-color: green;
      color: white;
      padding: 10px 25px;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="enterCounter">In</div>
    <div id="leaveCounter">Out</div>
  </div>

  
 <button class="saveBtn">Save Button </button>


 <script src="in.js"></script>
</body>
</html>
